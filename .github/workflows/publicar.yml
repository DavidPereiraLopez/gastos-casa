# Las fusiones hechas por Claude (app de GitHub) no lanzan solas el build de GitHub Pages.
# Este flujo lo pide en cada push a main, para que la app publicada esté siempre al día.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir build de Pages
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
